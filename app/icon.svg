<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ask My Body 求诸己 双竹">
  <defs>
    <path id="lf" d="M0 0 Q 14 -5 30 0 Q 14 5 0 0 Z"/>
    <linearGradient id="washV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#6f9a5e" stop-opacity=".55"/>
      <stop offset=".34" stop-color="#8fb87c" stop-opacity=".30"/>
      <stop offset=".66" stop-color="#b4d2a4" stop-opacity=".10"/>
      <stop offset="1"   stop-color="#b4d2a4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#6f9a5e" stop-opacity=".42"/>
      <stop offset="60%" stop-color="#7fa06e" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#7fa06e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bottom-up green wash (brand tint, survives downscale) -->
  <rect x="0" y="0" width="100" height="100" fill="url(#washV)"/>
  <ellipse cx="50" cy="99" rx="60" ry="28" fill="url(#ground)"/>

  <!-- two bold culms -->
  <path d="M40 99 C 39 66 40 40 42 17" stroke="#2f3f28" stroke-width="7.4" stroke-linecap="round" fill="none"/>
  <path d="M59 99 C 58 64 56 34 57 12" stroke="#1f2b14" stroke-width="8.8" stroke-linecap="round" fill="none"/>

  <!-- node gaps -->
  <g stroke="#eef4e6" stroke-width="3.1" stroke-linecap="round" fill="none" opacity=".96">
    <path d="M35.4 70 Q 41 67 46.6 70"/>
    <path d="M35.8 45 Q 41.4 42 46.8 45"/>
    <path d="M36.4 24 Q 41.8 21.4 47 24"/>
    <path d="M53.6 66 Q 59.6 62.4 65.6 66"/>
    <path d="M52.6 41 Q 58.6 37.6 64.4 41"/>
    <path d="M53 21 Q 58.8 18 64 21"/>
  </g>

  <!-- bold leaf crowns -->
  <use href="#lf" transform="translate(57 12) rotate(-64)  scale(1.5)"  fill="#1f2b14"/>
  <use href="#lf" transform="translate(57 12) rotate(-30)  scale(1.28)" fill="#3a4a32"/>
  <use href="#lf" transform="translate(57 12) rotate(-100) scale(1.4)"  fill="#243018"/>
  <use href="#lf" transform="translate(57 12) rotate(-132) scale(1.0)"  fill="#2f3f28"/>
  <use href="#lf" transform="translate(42 17) rotate(-118) scale(1.42)" fill="#2f3f28"/>
  <use href="#lf" transform="translate(42 17) rotate(-150) scale(1.05)" fill="#4a5e3e"/>
  <use href="#lf" transform="translate(42 17) rotate(-90)  scale(.95)"  fill="#3a4a32"/>
  <use href="#lf" transform="translate(57 34) rotate(28)   scale(.92)"  fill="#2f3f28" opacity=".9"/>
  <use href="#lf" transform="translate(41 44) rotate(152)  scale(.82)"  fill="#3a4a32" opacity=".85"/>
</svg>
